[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nfse-nacional"
version = "0.1.3"
description = "Client for Brazil's NFS-e Padrão Nacional (SEFIN Nacional / ADN) APIs"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.3",
    "cryptography>=44",
    "reportlab>=5.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfse_nacional = ["schemas/*/*.xsd", "data/*"]
